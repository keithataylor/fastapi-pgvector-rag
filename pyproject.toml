[project]
name = "fastapi-pgvector-rag"
version = "0.1.0"
description = "A private FastAPI retrieval-augmented generation backend."
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn>=0.34,<1.0"]

[dependency-groups]
dev = ["httpx2>=2.0,<3.0", "pytest>=8.3,<10.0", "ruff>=0.11,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
