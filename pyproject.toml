[project]
name = "fastapi-pgvector-rag"
version = "0.1.0"
description = "A private FastAPI retrieval-augmented generation backend."
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "pgvector>=0.4,<1.0",
    "pypdf>=5.0,<6.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = ["httpx2>=2.0,<3.0", "pytest>=8.3,<10.0", "ruff>=0.11,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "migration_integration: validates the pgvector extension Alembic lifecycle against PostgreSQL",
]

[tool.ruff]
target-version = "py311"
